syntax = "proto3";

package playerhub.v1;

import "playerhub/v1/state.proto";

option go_package = "playerhub/server/internal/wire/pb;pb";

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VERSION = 7;
}

message Hello {
  uint32 protocol_version = 1;
  uint32 view_radius = 2;
  bytes session_token = 3;
  string display_name = 4;
  repeated uint64 vanished = 5;
}

message Enter {}

message Exit {}

enum ChatChannel {
  CHAT_CHANNEL_GLOBAL = 0;
  CHAT_CHANNEL_LOCAL = 1;
  CHAT_CHANNEL_WHISPER = 2;
}

message ChatSend {
  uint32 request_id = 1;
  string text = 2;
  ChatChannel channel = 3;
  uint32 recipient = 4;
}

message Ping {
  uint32 request_id = 1;
}

message Vanish {
  uint64 session_id = 1;
  bool vanished = 2;
}

message Inspect {
  uint32 slot = 1;
}

message ClientMessage {
  oneof message {
    Hello hello = 1;
    Enter enter = 2;
    Exit exit = 3;
    Checkpoint checkpoint = 4;
    Context context = 5;
    Action action = 6;
    Appearance appearance = 7;
    Equipment equipment = 8;
    ChatSend chat = 9;
    Ping ping = 10;
    Vanish vanish = 11;
    Inspect inspect = 12;
  }
}

message Welcome {
  uint32 slot = 1;
  uint64 session_id = 2;
  string display_name = 3;
  bytes session_token = 4;
}

message Result {
  uint32 request_id = 1;
  bool ok = 2;
  string error = 3;
}

message PeerStates {
  repeated Checkpoint states = 1;
}

message PeerEnter {
  uint32 slot = 1;
  Appearance appearance = 2;
  Equipment equipment = 4;
  Context context = 5;
  Checkpoint state = 6;
}

message PeerContext {
  uint32 slot = 1;
  Context context = 2;
}

enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_OUT_OF_RANGE = 1;
  LEAVE_REASON_EXCLUDED = 2;
  LEAVE_REASON_EXITED = 3;
  LEAVE_REASON_DISCONNECTED = 4;
  LEAVE_REASON_VIEWER_UNPLACED = 5;
}

message PeerLeave {
  uint32 slot = 1;
  LeaveReason reason = 2;
}

message PeerAction {
  uint32 slot = 1;
  Action action = 2;
}

message PeerAppearance {
  uint32 slot = 1;
  Appearance appearance = 3;
}

message PeerEquipment {
  uint32 slot = 1;
  Equipment equipment = 2;
}

message ChatSpeaker {
  uint32 slot = 1;
  string name = 2;
  uint32 level = 4;
  uint64 session_id = 5;
}

message ChatMessage {
  ChatChannel channel = 1;
  ChatSpeaker sender = 2;
  ChatSpeaker recipient = 3;
  string text = 4;
}

message RosterEntry {
  uint32 slot = 1;
  string name = 2;
  uint64 session_id = 3;
}

message Roster {
  repeated RosterEntry joined = 1;
  uint32 left = 2;
}

message Inspection {
  uint32 slot = 1;
  uint32 level = 2;
  FormRef race = 3;
  DefaultRace default_race = 4;
}

message ServerMessage {
  oneof message {
    Welcome welcome = 1;
    Result result = 2;
    PeerStates peer_states = 3;
    PeerEnter peer_enter = 4;
    PeerContext peer_context = 5;
    PeerLeave peer_leave = 6;
    PeerAction peer_action = 7;
    PeerAppearance peer_appearance = 8;
    PeerEquipment peer_equipment = 9;
    ChatMessage chat_message = 10;
    Roster roster = 11;
    Inspection inspection = 12;
  }
}
