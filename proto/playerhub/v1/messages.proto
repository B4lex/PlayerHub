syntax = "proto3";

package playerhub.v1;

import "playerhub/v1/state.proto";

option go_package = "playerhub/server/internal/wire/pb;pb";

enum Protocol {
  PROTOCOL_UNSPECIFIED = 0;
  PROTOCOL_VERSION = 14;
}

message Hello {
  uint32 protocol_version = 1;
  uint32 view_radius = 2;
  bytes session_token = 3;
  string display_name = 4;
  repeated uint64 vanished = 5;
}

message Enter {}

message Exit {}

enum ChatChannel {
  CHAT_CHANNEL_GLOBAL = 0;
  CHAT_CHANNEL_NEARBY = 1;
  CHAT_CHANNEL_WHISPER = 2;
}

message ChatSend {
  uint32 request_id = 1;
  string text = 2;
  ChatChannel channel = 3;
  uint32 recipient = 4;
}

message Ping {
  uint32 request_id = 1;
}

message Vanish {
  uint64 session_id = 1;
  bool vanished = 2;
}

message Inspect {
  uint32 slot = 1;
}

message TradeRequest {
  uint32 slot = 1;
}

message TradeAnswer {
  uint32 trade_id = 1;
  bool accept = 2;
}

message TradeEffect {
  FormRef effect = 1;
  float magnitude = 2;
  uint32 area = 3;
  uint32 duration = 4;
  float cost = 5;
}

message TradeItem {
  FormRef item = 1;
  uint32 count = 2;
  FormRef enchantment = 3;
  repeated TradeEffect effects = 4;
  uint32 maximum_charge = 5;
  float charge = 6;
  float health = 7;
  string name = 8;
  uint32 soul = 9;
}

// From a client: its own offer. From the server: the peer's offer.
message TradeOffer {
  uint32 trade_id = 1;
  uint64 revision = 2;
  repeated TradeItem items = 3;
}

enum TradeSkipReason {
  TRADE_SKIP_REASON_UNSPECIFIED = 0;
  TRADE_SKIP_REASON_MISSING_ITEM = 1;
  TRADE_SKIP_REASON_WRONG_TYPE = 2;
  TRADE_SKIP_REASON_MISSING_EFFECT = 3;
  TRADE_SKIP_REASON_BAD_ENCHANTMENT = 4;
}

message TradeSkip {
  uint32 index = 1;
  TradeSkipReason reason = 2;
  string plugin = 3;
}

// From a client: the items of the peer's offer revision it cannot receive. From the
// server: the peer's report on this client's offer.
message TradeReport {
  uint32 trade_id = 1;
  uint64 revision = 2;
  repeated TradeSkip skipped = 3;
}

// From a client: it accepts its own and the peer's offer revisions. From the server:
// the peer's acceptance, with own_revision the recipient's, as in TradeCommit.
message TradeAccept {
  uint32 trade_id = 1;
  uint64 own_revision = 2;
  uint64 peer_revision = 3;
}

enum TradeCloseReason {
  TRADE_CLOSE_REASON_UNSPECIFIED = 0;
  TRADE_CLOSE_REASON_DECLINED = 1;
  TRADE_CLOSE_REASON_EXPIRED = 2;
  TRADE_CLOSE_REASON_CANCELLED = 3;
  TRADE_CLOSE_REASON_BUSY = 4;
  TRADE_CLOSE_REASON_OUT_OF_RANGE = 5;
  TRADE_CLOSE_REASON_COMBAT = 6;
  TRADE_CLOSE_REASON_MENU = 7;
  TRADE_CLOSE_REASON_DISCONNECTED = 8;
  TRADE_CLOSE_REASON_FAILED = 9;
  TRADE_CLOSE_REASON_UNAVAILABLE = 10;
  TRADE_CLOSE_REASON_TRANSFORMED = 11;
}

message TradeCancel {
  uint32 trade_id = 1;
  TradeCloseReason reason = 2;
}

// From a client: the plugins its offerable items come from, for the other game to
// check. From the server: the peer's query.
message TradePluginQuery {
  uint32 trade_id = 1;
  repeated string plugins = 2;
}

// From a client: the indices into the peer's oldest unanswered query of the plugins
// this game has not loaded. From the server: the peer's reply to this client's query.
message TradePluginReply {
  uint32 trade_id = 1;
  repeated uint32 missing = 2;
}

message ClientMessage {
  oneof message {
    Hello hello = 1;
    Enter enter = 2;
    Exit exit = 3;
    Checkpoint checkpoint = 4;
    Context context = 5;
    Action action = 6;
    Appearance appearance = 7;
    Equipment equipment = 8;
    ChatSend chat = 9;
    Ping ping = 10;
    Vanish vanish = 11;
    Inspect inspect = 12;
    TradeRequest trade_request = 13;
    TradeAnswer trade_answer = 14;
    TradeOffer trade_offer = 15;
    TradeReport trade_report = 16;
    TradeAccept trade_accept = 17;
    TradeCancel trade_cancel = 18;
    TradePluginQuery trade_plugin_query = 19;
    TradePluginReply trade_plugin_reply = 20;
  }
}

message Welcome {
  uint32 slot = 1;
  uint64 session_id = 2;
  string display_name = 3;
  bytes session_token = 4;
}

enum ChatRejection {
  CHAT_REJECTION_NONE = 0;
  CHAT_REJECTION_INVALID = 1;
  CHAT_REJECTION_RATE_LIMITED = 2;
  CHAT_REJECTION_NOT_IN_WORLD = 3;
  CHAT_REJECTION_UNKNOWN_RECIPIENT = 4;
}

// NONE accepts the ChatSend.
message ChatResult {
  uint32 request_id = 1;
  ChatRejection rejection = 2;
}

message Pong {
  uint32 request_id = 1;
}

message PeerStates {
  repeated Checkpoint states = 1;
}

message PeerEnter {
  uint32 slot = 1;
  Appearance appearance = 2;
  Equipment equipment = 3;
  Context context = 4;
  Checkpoint state = 5;
}

message PeerContext {
  uint32 slot = 1;
  Context context = 2;
}

enum LeaveReason {
  LEAVE_REASON_UNSPECIFIED = 0;
  LEAVE_REASON_OUT_OF_RANGE = 1;
  LEAVE_REASON_EXCLUDED = 2;
  LEAVE_REASON_EXITED = 3;
  LEAVE_REASON_DISCONNECTED = 4;
  LEAVE_REASON_VIEWER_UNPLACED = 5;
}

message PeerLeave {
  uint32 slot = 1;
  LeaveReason reason = 2;
}

message PeerAction {
  uint32 slot = 1;
  Action action = 2;
}

message PeerAppearance {
  uint32 slot = 1;
  Appearance appearance = 2;
}

message PeerEquipment {
  uint32 slot = 1;
  Equipment equipment = 2;
}

message PlayerIdentity {
  uint32 slot = 1;
  string name = 2;
  uint64 session_id = 3;
}

message ChatMessage {
  ChatChannel channel = 1;
  PlayerIdentity sender = 2;
  PlayerIdentity recipient = 3;
  string text = 4;
}

message Roster {
  repeated PlayerIdentity joined = 1;
  uint32 left = 2;
}

// Roster players entering and leaving the recipient's Nearby chat reach, which is mutual.
message NearbyPlayers {
  repeated uint32 joined = 1;
  repeated uint32 left = 2;
}

message Inspection {
  uint32 slot = 1;
  uint32 level = 2;
  FormRef race = 3;
  DefaultRace default_race = 4;
}

message TradeInvite {
  uint32 trade_id = 1;
  PlayerIdentity sender = 2;
  PlayerIdentity recipient = 3;
}

message TradeOpen {
  uint32 trade_id = 1;
}

// own_revision is the recipient's.
message TradeCommit {
  uint32 trade_id = 1;
  uint64 own_revision = 2;
  uint64 peer_revision = 3;
}

// trade_id 0 refuses a TradeRequest.
message TradeClose {
  uint32 trade_id = 1;
  TradeCloseReason reason = 2;
}

message ServerMessage {
  oneof message {
    Welcome welcome = 1;
    ChatResult chat_result = 2;
    PeerStates peer_states = 3;
    PeerEnter peer_enter = 4;
    PeerContext peer_context = 5;
    PeerLeave peer_leave = 6;
    PeerAction peer_action = 7;
    PeerAppearance peer_appearance = 8;
    PeerEquipment peer_equipment = 9;
    ChatMessage chat_message = 10;
    Roster roster = 11;
    Inspection inspection = 12;
    TradeInvite trade_invite = 13;
    TradeOpen trade_open = 14;
    TradeOffer trade_offer = 15;
    TradeReport trade_report = 16;
    TradeAccept trade_accept = 17;
    TradeCommit trade_commit = 18;
    TradeClose trade_close = 19;
    NearbyPlayers nearby_players = 20;
    TradePluginQuery trade_plugin_query = 21;
    TradePluginReply trade_plugin_reply = 22;
    Pong pong = 23;
  }
}
