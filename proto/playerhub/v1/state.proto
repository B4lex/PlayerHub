syntax = "proto3";

package playerhub.v1;

option go_package = "playerhub/server/internal/wire/pb;pb";

message FormRef {
  string plugin = 1;
  uint32 form_id = 2;
}

message Checkpoint {
  uint32 player = 1;
  uint64 sequence = 2;
  // Position in quarter units.
  sint32 x = 3;
  sint32 y = 4;
  sint32 z = 5;
  uint32 heading = 6;
  sint32 pitch = 7;
  uint32 speed = 8;
  uint32 direction = 9;
  uint32 flags = 10;
  uint32 time = 11;
}

enum MovementState {
  MOVEMENT_STATE_IDLE = 0;
  MOVEMENT_STATE_WALKING = 1;
  MOVEMENT_STATE_RUNNING = 2;
  MOVEMENT_STATE_SPRINTING = 3;
  MOVEMENT_STATE_SNEAKING_IDLE = 4;
  MOVEMENT_STATE_SNEAKING_WALKING = 5;
  MOVEMENT_STATE_SNEAKING_RUNNING = 6;
}

// Ordered by how often a flag is set: a varint below 128 is one byte, so the
// common on-foot flags come first.
enum CheckpointFlag {
  CHECKPOINT_FLAG_NONE = 0;
  CHECKPOINT_FLAG_GROUNDED = 8;
  CHECKPOINT_FLAG_WEAPON_DRAWN = 16;
  CHECKPOINT_FLAG_JUMPING = 32;
  CHECKPOINT_FLAG_BLOCKING = 64;
  CHECKPOINT_FLAG_BOW_DRAWN = 128;
  CHECKPOINT_FLAG_CASTING_LEFT = 256;
  CHECKPOINT_FLAG_CASTING_RIGHT = 512;
  CHECKPOINT_FLAG_SWIMMING = 1024;
  CHECKPOINT_FLAG_MOUNTED = 2048;
  CHECKPOINT_FLAG_DEAD = 4096;
  CHECKPOINT_FLAG_LEVITATING = 8192;
  CHECKPOINT_FLAG_MIST_FORM = 16384;
  CHECKPOINT_FLAG_BATS = 32768;
}

enum Shapeshift {
  SHAPESHIFT_NONE = 0;
  SHAPESHIFT_WEREWOLF = 1;
  SHAPESHIFT_VAMPIRE_LORD = 2;
  SHAPESHIFT_WEREBEAR = 3;
}

message Context {
  // Unset in a worldspace, so crossing exterior cells leaves the context unchanged.
  FormRef interior_cell = 1;
  FormRef worldspace = 2;
  uint64 graph_epoch = 3;
  FormRef furniture = 4;
  Shapeshift shapeshift = 5;
}

enum AttackAction {
  ATTACK_ACTION_UNSPECIFIED = 0;
  ATTACK_ACTION_NORMAL = 1;
  ATTACK_ACTION_LEFT = 2;
  ATTACK_ACTION_DUAL = 3;
  ATTACK_ACTION_BASH = 4;
}

enum PowerDirection {
  POWER_DIRECTION_NONE = 0;
  POWER_DIRECTION_STANDING = 1;
  POWER_DIRECTION_FORWARD = 2;
  POWER_DIRECTION_BACKWARD = 3;
  POWER_DIRECTION_LEFT = 4;
  POWER_DIRECTION_RIGHT = 5;
}

// A beast form's action, from the vanilla behavior graph of that form. Werewolf
// values also serve the werebear, which shares the werewolf's graph.
enum BeastAction {
  BEAST_ACTION_UNSPECIFIED = 0;
  BEAST_ACTION_WEREWOLF_ATTACK_RIGHT = 1;
  BEAST_ACTION_WEREWOLF_ATTACK_LEFT = 2;
  BEAST_ACTION_WEREWOLF_ATTACK_RIGHT_POWER = 3;
  BEAST_ACTION_WEREWOLF_ATTACK_LEFT_POWER = 4;
  BEAST_ACTION_WEREWOLF_ATTACK_DUAL = 5;
  BEAST_ACTION_WEREWOLF_ATTACK_BACKHAND = 6;
  BEAST_ACTION_WEREWOLF_ATTACK_RIGHT_SIDE = 7;
  BEAST_ACTION_WEREWOLF_ATTACK_LEFT_SIDE = 8;
  BEAST_ACTION_WEREWOLF_ATTACK_RIGHT_RUNNING_POWER = 9;
  BEAST_ACTION_WEREWOLF_ATTACK_LEFT_RUNNING_POWER = 10;
  BEAST_ACTION_WEREWOLF_ATTACK_DUAL_RUNNING = 11;
  BEAST_ACTION_WEREWOLF_ATTACK_DUAL_SPRINTING = 12;
  BEAST_ACTION_WEREWOLF_ATTACK_RIGHT_SPRINTING = 13;
  BEAST_ACTION_WEREWOLF_ATTACK_LEFT_SPRINTING = 14;
  BEAST_ACTION_WEREWOLF_HOWL_START = 15;
  BEAST_ACTION_WEREWOLF_HOWL_RELEASE = 16;
  BEAST_ACTION_WEREWOLF_HOWL_END = 17;
  BEAST_ACTION_WEREWOLF_FEED = 18;
  BEAST_ACTION_WEREWOLF_FEED_PAIRED = 19;
  BEAST_ACTION_VAMPIRE_LORD_ATTACK_RIGHT = 32;
  BEAST_ACTION_VAMPIRE_LORD_ATTACK_LEFT = 33;
  BEAST_ACTION_VAMPIRE_LORD_ATTACK_POWER_RIGHT = 34;
  BEAST_ACTION_VAMPIRE_LORD_ATTACK_POWER_LEFT = 35;
  BEAST_ACTION_VAMPIRE_LORD_BATS_START = 36;
  BEAST_ACTION_VAMPIRE_LORD_BATS_STOP = 37;
  BEAST_ACTION_VAMPIRE_LORD_FEED_FRONT = 38;
  BEAST_ACTION_VAMPIRE_LORD_FEED_BACK = 39;
  BEAST_ACTION_VAMPIRE_LORD_CAST_BEGIN_LEFT = 40;
  BEAST_ACTION_VAMPIRE_LORD_CAST_BEGIN_RIGHT = 41;
  BEAST_ACTION_VAMPIRE_LORD_CAST_AIMED_LEFT = 42;
  BEAST_ACTION_VAMPIRE_LORD_CAST_AIMED_RIGHT = 43;
  BEAST_ACTION_VAMPIRE_LORD_CAST_CONCENTRATION_LEFT = 44;
  BEAST_ACTION_VAMPIRE_LORD_CAST_CONCENTRATION_RIGHT = 45;
  BEAST_ACTION_VAMPIRE_LORD_CAST_READY_LEFT = 46;
  BEAST_ACTION_VAMPIRE_LORD_CAST_READY_RIGHT = 47;
  BEAST_ACTION_VAMPIRE_LORD_CAST_RELEASE_LEFT = 48;
  BEAST_ACTION_VAMPIRE_LORD_CAST_RELEASE_RIGHT = 49;
  BEAST_ACTION_VAMPIRE_LORD_CAST_INTERRUPT_LEFT = 50;
  BEAST_ACTION_VAMPIRE_LORD_CAST_INTERRUPT_RIGHT = 51;
}

message Attack {
  AttackAction action = 1;
  // NONE unless a power attack.
  PowerDirection direction = 2;
}

message Action {
  uint64 action_sequence = 1;
  uint64 graph_epoch = 2;
  uint64 checkpoint_sequence = 3;
  oneof kind {
    Attack attack = 4;
    BeastAction beast = 5;
  }
}

message Color {
  uint32 r = 1;
  uint32 g = 2;
  uint32 b = 3;
}

message HeadPart {
  FormRef form = 1;
  uint32 type = 2;
}

message Tint {
  uint32 index = 1;
  uint32 type = 2;
  Color color = 3;
  float alpha = 4;
}

message DefaultRace {
  FormRef race = 1;
  // Ignored by receivers; senders copy Appearance.female for 1.1.0 clients.
  // TODO: remove with the next protocol bump, making default_race a FormRef.
  bool female = 2;
}

message Appearance {
  uint64 revision = 1;
  string name = 2;
  uint32 level = 3;
  FormRef race = 4;
  bool female = 5;
  float weight = 6;
  float height = 7;
  repeated HeadPart head_parts = 8;
  Color hair_color = 9;
  FormRef face_details = 10;
  Color body_tint = 11;
  repeated float face_morphs = 12;
  repeated sint32 face_parts = 13;
  repeated Tint tints = 14;
  DefaultRace default_race = 15;
  // Head parts that 1.1.0 clients reject in head_parts: a type above 6, or
  // more than 16 parts. They skip this field as unknown. At most 32 parts in
  // both fields together.
  // TODO: merge into head_parts with the next protocol bump.
  repeated HeadPart added_head_parts = 16;
}

enum HandKind {
  HAND_KIND_UNSPECIFIED = 0;
  HAND_KIND_WEAPON = 1;
  HAND_KIND_TORCH = 2;
  HAND_KIND_SPELL = 3;
}

message Armor {
  FormRef form = 1;
  uint32 slot_mask = 2;
}

message Hand {
  HandKind kind = 1;
  FormRef form = 2;
  uint32 weapon_type = 3;
  FormRef casting_art = 4;
  FormRef casting_light = 5;
}

message DefaultOutfit {
  repeated Armor armor = 1;
  repeated Hand hands = 2;
  FormRef ammo = 3;
}

message Equipment {
  uint64 revision = 1;
  repeated Armor armor = 2;
  Hand right_hand = 3;
  Hand left_hand = 4;
  FormRef ammo = 5;
  DefaultOutfit default_outfit = 6;
  // The spell hands and worn armor of a vampire lord; the fields above keep the
  // character's items.
  Hand beast_right_hand = 7;
  Hand beast_left_hand = 8;
  repeated Armor beast_armor = 9;
}
